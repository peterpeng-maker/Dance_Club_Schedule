<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="danceBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#danceBgGrad)"/>
  
  <!-- Calendar Base Card -->
  <rect x="96" y="104" width="320" height="312" rx="36" fill="#130d24" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
  
  <!-- Calendar Top Bar -->
  <path d="M96 140 Q96 104 132 104 L380 104 Q416 104 416 140 L416 176 L96 176 Z" fill="url(#neonPink)"/>
  
  <!-- Calendar Pins -->
  <rect x="160" y="80" width="24" height="48" rx="12" fill="#ffffff"/>
  <rect x="328" y="80" width="24" height="48" rx="12" fill="#ffffff"/>
  
  <!-- DANCE Title Text -->
  <text x="256" y="154" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">DANCE CLUB</text>
  
  <!-- Dancing Figure / Dynamic Silhouette Motif -->
  <g filter="url(#glow)">
    <!-- Dancer head -->
    <circle cx="256" cy="225" r="22" fill="#fbcfe8"/>
    <!-- Dancer dynamic torso & limbs -->
    <!-- Torso -->
    <path d="M256 250 Q265 285 248 310" stroke="#f472b6" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Left Arm up -->
    <path d="M256 260 Q220 240 200 210" stroke="#c084fc" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Right Arm pointing dynamic up -->
    <path d="M256 260 Q290 245 320 220" stroke="#f472b6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Left Leg kicking -->
    <path d="M248 310 Q220 335 185 345" stroke="#c084fc" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Right Leg plant -->
    <path d="M248 310 Q270 345 280 380" stroke="#f472b6" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Musical Note Sparks -->
  <text x="175" y="270" font-size="26" fill="#fbbf24">🎵</text>
  <text x="325" y="295" font-size="24" fill="#67e8f9">✨</text>
  <text x="320" y="365" font-size="22" fill="#a7f3d0">💃</text>
</svg>
